[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyenv-fridge"
version = "0.1.0"
description = "Backup and restore system for Python virtual environments"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["pyenv", "virtualenv", "backup", "venv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
]
# No third-party runtime dependencies – only the standard library is required.
dependencies = []

[project.scripts]
fridge = "pyenv_fridge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyenv_fridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["pyenv_fridge"]
omit = ["tests/*"]
